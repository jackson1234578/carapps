yaml
name: Build Tweak and Sileo Repo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/theos/theos:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Repo Tools
        run: apt-get update && apt-get install -y dpkg-dev bzip2

      - name: Compile Rootless DEB
        run: make package FINALPACKAGE=1

      - name: Generate Sileo Repo Files
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          cd repo
          dpkg-scanpackages -m ./debs > Packages
          bzip2 -c9 Packages > Packages.bz2
          printf "Origin: CarParkApps Repo\nLabel: CarParkApps\nSuite: stable\nVersion: 1.0\nCodename: ios\nArchitectures: iphoneos-arm64\nComponents: main\nDescription: Custom iOS 17 Rootless CarPlay Tweak Repo\n" > Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
